name: Pre-warm scrape cache

# Populate the Supabase scraped_products cache for Trine's common categories.
# Runs here (not on Netlify) because a live scrape takes 55-96s, beyond the
# free-tier Netlify function budget. GitHub Actions jobs have hours of budget.

on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC (~pre-US-morning)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Warm the cache
        run: npx -y tsx scripts/prewarm.ts
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
